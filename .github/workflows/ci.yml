name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Disable git://
        run: git config --global protocol.git.allow never
      - name: Install dependencies
        run: npm ci
      - name: Disable pre & post scripts for ci
        run: echo "NPM_CONFIG_IGNORE_SCRIPTS=true" >> "$GITHUB_ENV"
      - run: npm run lint

  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Disable git://
        run: git config --global protocol.git.allow never
      - name: Install dependencies
        run: npm ci
      - name: Disable pre & post scripts for ci
        run: echo "NPM_CONFIG_IGNORE_SCRIPTS=true" >> "$GITHUB_ENV"
      - name: Type-check src and test
        run: npm run typecheck
      - name: Build ESM + CJS output
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Disable git://
        run: git config --global protocol.git.allow never
      - name: Install dependencies
        run: npm ci
      - name: Disable pre & post scripts for ci
        run: echo "NPM_CONFIG_IGNORE_SCRIPTS=true" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: npm test
      - run: npm run check-coverage
