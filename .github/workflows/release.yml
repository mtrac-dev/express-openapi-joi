name: Release

on:
  release:
    types:
      - published

jobs:
  publish:
    # Publish from the public repository only.
    if: github.repository == 'mtrac-dev/express-openapi-joi'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm 11, which trusted publishing needs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Disable git://
        run: git config --global protocol.git.allow never
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - name: Check the version isn't already on npm
        id: published
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "::warning::$spec is already on npm, so it won't be published"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - run: npm run lint
      - run: npm run check-coverage
      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --tag "$DIST_TAG"
